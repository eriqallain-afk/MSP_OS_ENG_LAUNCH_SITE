name: Poids des images (garde-fou)

# Empêche le site de s'alourdir : échoue si une NOUVELLE image dépasse le budget,
# ou si une image grandfathered regrossit. Ne modifie aucune image (lit la taille).
# Pour rendre bloquant : Branch protection → Require status checks → cocher "image-weight".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  image-weight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Vérifier le poids des images
        run: python scripts/check_image_weight.py
